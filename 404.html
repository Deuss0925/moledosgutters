<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Moledo's Gutter Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--navy-950:#0A141C;--navy-900:#122430;--accent:#C8864E;--accent-2:#E0A06A;--ice:#E9EFF4;--mist:#9FB0BD}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;
       font-family:'Manrope',system-ui,sans-serif;background:var(--navy-900);color:var(--ice);line-height:1.6}
  .code{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2)}
  h1{font-family:'Archivo',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;
     font-size:clamp(2rem,6vw,3.2rem);margin:18px 0 0}
  p{color:rgba(233,239,244,.72);margin-top:16px;max-width:34em}
  .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
  a.btn{display:inline-flex;align-items:center;gap:.5em;border-radius:999px;padding:.85em 1.6em;font-size:.9rem;font-weight:700;
        text-decoration:none;border:1px solid transparent;transition:transform .2s,background .2s,border-color .2s}
  .p1{background:var(--accent);color:var(--navy-950)}
  .p1:hover{background:var(--accent-2);transform:translateY(-2px)}
  .p2{border-color:rgba(233,239,244,.2);background:rgba(255,255,255,.05);color:var(--ice)}
  .p2:hover{border-color:var(--accent-2);transform:translateY(-2px)}
</style>
</head>
<body>
  <main>
    <span class="code">Error 404</span>
    <h1>That page isn't here.</h1>
    <p>The link may be old or mistyped. Everything about our gutter services is on the main page — or just give us a call, it's faster.</p>
    <div class="row">
      <a class="btn p1" href="/">Back to the site</a>
      <a class="btn p2" href="tel:+17864996534">Call (786) 499-6534</a>
    </div>
  </main>
</body>
</html>
